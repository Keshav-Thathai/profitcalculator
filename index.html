<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Shop Profit Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .calc-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #218838;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            display: none;
        }
        .profit { background-color: #d4edda; color: #155724; }
        .loss { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="calc-card">
    <h2>📊 Shop Daily Profit Analyzer</h2>
    
    <div class="input-group">
        <label>Total Daily Sales Revenue (Rs):</label>
        <input type="number" id="sales" value="0">
    </div>
    
    <div class="input-group">
        <label>Wholesale Product Cost (Rs):</label>
        <input type="number" id="cost" value="0">
    </div>
    
    <div class="input-group">
        <label>Other Expenses (Rent, Bills, Staff) (Rs):</label>
        <input type="number" id="expenses" value="0">
    </div>
    
    <button onclick="calculateProfit()">Calculate Net Earnings 🚀</button>
    
    <div id="result" class="result-box"></div>
</div>

<script>
function calculateProfit() {
    let sales = parseFloat(document.getElementById('sales').value) || 0;
    let cost = parseFloat(document.getElementById('cost').value) || 0;
    let expenses = parseFloat(document.getElementById('expenses').value) || 0;
    
    let totalExpense = cost + expenses;
    let netProfit = sales - totalExpense;
    
    let resultDiv = document.getElementById('result');
    resultDiv.style.display = "block";
    
    if (netProfit >= 0) {
        resultDiv.className = "result-box profit";
        resultDiv.innerHTML = "🎉 Net Profit This Day: Rs. " + netProfit;
    } else {
        resultDiv.className = "result-box loss";
        resultDiv.innerHTML = "⚠️ Net Loss This Day: Rs. " + Math.abs(netProfit);
    }
}
</script>

</body>
</html>
